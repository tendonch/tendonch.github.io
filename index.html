<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ghost Club（ゴースト部）公式ポータルサイト｜夜桜てんどん・ぺとら</title>
    <meta name="description" content="ゴースト部（Ghost Club）の公式ポータルサイト。夜桜てんどん・ぺとらのYouTubeチャンネル、マイクラのデータパック・リソースパック配布、質問受付などをまとめています。" id="metaDesc">
    <link rel="canonical" href="https://tendonch.github.io/" id="canon">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Ghost Club（ゴースト部）">
    <meta property="og:title" content="Ghost Club（ゴースト部）公式ポータルサイト｜夜桜てんどん・ぺとら" id="ogTitle">
    <meta property="og:description" content="ゴースト部（Ghost Club）の公式ポータルサイト。夜桜てんどん・ぺとらのYouTubeチャンネル、マイクラのデータパック・リソースパック配布、質問受付などをまとめています。" id="ogDesc">
    <meta property="og:url" content="https://tendonch.github.io/" id="ogUrl">
    <meta property="og:image" content="https://tendonch.github.io/bg-dark.jpg">
    <meta property="og:locale" content="ja_JP">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="tendon-icon.png">
    <link rel="apple-touch-icon" href="tendon-icon.png">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Ghost Club（ゴースト部）",
      "alternateName": ["Ghost Club", "ゴースト部", "ゴースト部 公式ポータルサイト"],
      "url": "https://tendonch.github.io/",
      "inLanguage": "ja"
    }
    </script>
    <meta name="color-scheme" content="light dark">
    <meta name="darkreader-lock">
    <link rel="stylesheet" href="style.css?v=9">
    <script>
        // 画面が描画される前にライト/ダークを決める（背景画像のちらつき・表示漏れ防止）
        (function () {
            try {
                if (localStorage.getItem('themeV') !== '2') { localStorage.removeItem('theme'); localStorage.setItem('themeV', '2'); }   // 初期値を「システム」に統一（1回だけ）
                var t = localStorage.getItem('theme');
                var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (dark) document.documentElement.setAttribute('data-theme', 'dark');
            } catch (e) {}
        })();
    </script>
</head>
<body>

    <div class="bg-image-layer" id="bgLayer"></div>

    <!-- お知らせバー（データベースから表示） -->
    <div id="announceArea"></div>

    <div class="container">
        <nav id="siteNav" class="site-nav"></nav>
        <h1>Ghost Club</h1>
        <p class="site-desc">公式ポータルサイト</p>

        <!-- 1. グループchのリンク -->
        <div class="section">
            <a href="https://www.youtube.com/@ghost_club_member" target="_blank" class="group-main-card">
                <h2>ゴースト部（グループチャンネル）</h2>
                <p>▶ チャンネルへ移動する</p>
            </a>
        </div>

        <!-- 2. グループメンバーの紹介（データベースから表示） -->
        <div class="section">
            <div class="title-row">
                <div class="section-title">グループメンバー紹介</div>
                <div id="memberAdd"></div>
            </div>
            <div id="memberArea"></div>
        </div>

        <!-- 3. グループチャンネルの最新動画 -->
        <div class="section">
            <div class="section-title" style="border-color: #3b82f6;">
                グループチャンネル 最新の動画
            </div>
            <div class="video-container">
                <!-- ゴースト部: UCoE7F9FSBVOehNphFViBjBg -->
                <iframe src="https://www.youtube.com/embed?listType=playlist&list=UULFoE7F9FSBVOehNphFViBjBg"
                        title="YouTube video player" loading="lazy"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        allowfullscreen></iframe>
            </div>
            <a class="video-fallback" href="https://www.youtube.com/@ghost_club_member/videos" target="_blank" rel="noopener">動画が表示されない場合はYouTubeで見る ▶</a>
        </div>

        <!-- 4. 個人チャンネル（データベースから表示） -->
        <div id="channelArea"></div>

    </div>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="site.js?v=10"></script>
    <script>
    // データベースに接続できないとき・未設定のときに表示する内容
    const FALLBACK_MEMBERS = [];
    const FALLBACK_CHANNELS = [
        {
            id: 'tendon', name: '夜桜てんどん', color: '#ff7700', icon_url: 'tendon-icon.png',
            youtube_channel_id: 'UCgzALvAchpNYm1Hvgn_0OcA', sort_order: 1,
            links: [
                { label: 'メインチャンネル', handle: '@てんどん_ch', url: 'https://www.youtube.com/@てんどん_ch' },
                { label: 'サブチャンネル', handle: '@てんどん_ch_sub', url: 'https://www.youtube.com/@てんどん_ch_sub' },
                { label: '生声アカウント', handle: '@てんどん_ch_namakoe', url: 'https://www.youtube.com/@てんどん_ch_namakoe' }
            ]
        },
        {
            id: 'petra', name: 'ぺとら', color: '#ff4757', icon_url: 'petra-icon.png',
            youtube_channel_id: 'UCMJ8WfI4YRVYI4pCLCrDr5g', sort_order: 2,
            links: [
                { label: 'メインアカウント', handle: '@petra-0143', url: 'https://www.youtube.com/@petra-0143' },
                { label: 'サブチャンネル', handle: '@patra.ptora.0143', url: 'https://www.youtube.com/@patra.ptora.0143' },
                { label: '生声アカウント', handle: '@PetoUltra-GC-510', url: 'https://www.youtube.com/@PetoUltra-GC-510' }
            ]
        }
    ];

    state.members = FALLBACK_MEMBERS;
    state.channels = FALLBACK_CHANNELS;

    async function loadPageData() {
        if (!sb) return;
        const [m, c] = await Promise.all([
            sb.from('members').select('*').order('sort_order').order('created_at'),
            sb.from('channels').select('*').order('sort_order').order('created_at')
        ]);
        if (m.error || c.error) { console.error('データ取得エラー', m.error || c.error); return; }
        state.members = m.data;
        state.channels = c.data;
    }

    function renderMembers() {
        $('#memberAdd').innerHTML = editMode
            ? '<button class="mini-btn add" data-act="add" data-kind="member">＋ 追加</button>' : '';
        const box = $('#memberArea');
        if (!state.members.length) {
            box.innerHTML = '<div class="member-box">まだメンバーが登録されていません。</div>';
            return;
        }
        box.innerHTML = '<div class="member-grid">' + state.members.map(m => {
            const icon = safeIcon(m.icon_url);
            const avatar = icon
                ? `<img class="member-avatar" src="${esc(icon)}" alt="">`
                : `<div class="member-avatar ph">${esc((m.name || '?').slice(0, 1))}</div>`;
            const body = `${avatar}<div class="member-info">
                <div class="member-name">${esc(m.name)}</div>
                ${m.role ? `<div class="member-role">${esc(m.role)}</div>` : ''}
                ${m.intro ? `<div class="member-intro">${esc(m.intro)}</div>` : ''}
            </div>`;
            const inner = (m.link_url && !editMode)
                ? `<a class="member-main" href="${esc(safeUrl(m.link_url))}" target="_blank" rel="noopener">${body}</a>`
                : `<div class="member-main">${body}</div>`;
            return `<div class="member-card">${inner}${adminBtns('member', m.id)}</div>`;
        }).join('') + '</div>';
    }

    function renderChannels() {
        const html = state.channels.map(ch => {
            const color = /^#[0-9a-fA-F]{6}$/.test(ch.color) ? ch.color : '#3b82f6';
            const icon = safeIcon(ch.icon_url);
            const links = Array.isArray(ch.links) ? ch.links : [];
            const video = validChId(ch.youtube_channel_id) ? `
                <div class="sub-section-title">最新動画</div>
                <div class="video-container">
                    <iframe src="https://www.youtube.com/embed?listType=playlist&list=UULF${ch.youtube_channel_id.slice(2)}"
                            title="YouTube video player" loading="lazy"
                            referrerpolicy="strict-origin-when-cross-origin"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen></iframe>
                </div>
                <a class="video-fallback" href="https://www.youtube.com/channel/${ch.youtube_channel_id}/videos" target="_blank" rel="noopener">動画が表示されない場合はYouTubeで見る ▶</a>` : '';
            const cards = links.map(l => `
                <a href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener" class="card">
                    <div class="card-info">
                        <div class="card-title">${esc(l.label)}</div>
                        <div class="card-sub">${esc(l.handle)}</div>
                    </div>
                    <div class="btn" style="background-color:${color}">見る</div>
                </a>`).join('');
            return `
            <div class="section">
                <div class="section-title" style="border-color:${color};">
                    ${icon ? `<img src="${esc(icon)}" alt="${esc(ch.name)}アイコン" class="channel-icon">` : ''}
                    ${esc(ch.name)} (個人チャンネル)
                    ${adminBtns('channel', ch.id)}
                </div>
                ${video}
                ${links.length ? `<div class="sub-section-title">個人チャンネルのリンク</div><div class="card-list">${cards}</div>` : ''}
            </div>`;
        }).join('');
        const add = editMode
            ? '<div class="section"><button class="mini-btn add big" data-act="add" data-kind="channel">＋ 個人チャンネルを追加</button></div>' : '';
        setHtml($('#channelArea'), html + add);
    }

    function renderPage() { renderMembers(); renderChannels(); }

    Object.assign(FORMS, {
        member: {
            table: 'members', listKey: 'members', title: 'メンバー',
            fields: [
                { k: 'name', label: '名前', type: 'text', required: true },
                { k: 'role', label: '肩書き・ひとこと（任意）', type: 'text' },
                { k: 'intro', label: '自己紹介（任意）', type: 'textarea' },
                { k: 'icon_url', label: 'アイコン', type: 'image' },
                { k: 'link_url', label: 'リンクURL（任意・押したときの移動先）', type: 'text' },
                { k: 'sort_order', label: '表示順（小さいほど上）', type: 'number' }
            ]
        },
        channel: {
            table: 'channels', listKey: 'channels', title: '個人チャンネル',
            fields: [
                { k: 'name', label: '表示名（「(個人チャンネル)」は自動で付きます）', type: 'text', required: true },
                { k: 'color', label: 'テーマカラー', type: 'color' },
                { k: 'youtube_channel_id', label: 'YouTubeチャンネルID（最新動画の表示用）', type: 'text', hint: 'UC から始まる24文字。空なら動画は表示しません' },
                { k: 'icon_url', label: 'アイコン', type: 'image' },
                { k: 'links', label: 'リンク一覧（1行に1つ）', type: 'lines', toText: linksToText, fromText: textToLinks, hint: '「ラベル | 表示するハンドル | URL」の形で書きます。例: メインチャンネル | @abc | https://www.youtube.com/@abc' },
                { k: 'sort_order', label: '表示順（小さいほど上）', type: 'number' }
            ]
        }
    });


    function linksToText(links) {
        return (Array.isArray(links) ? links : []).map(l => `${l.label || ''} | ${l.handle || ''} | ${l.url || ''}`).join('\n');
    }
    function textToLinks(t) {
        return t.split('\n').map(line => line.split('|').map(s => s.trim()))
            .filter(p => p.length >= 3 && p[2])
            .map(p => ({ label: p[0], handle: p[1], url: p.slice(2).join('|') }));
    }

    startSite();
    </script>
</body>
</html>
