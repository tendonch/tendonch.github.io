<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>他のページ｜Ghost Club（ゴースト部）</title>
    <meta name="description" content="ゴースト部（Ghost Club）のメンバーや企画ごとのページ一覧です。" id="metaDesc">
    <link rel="canonical" href="https://tendonch.github.io/people.html" id="canon">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Ghost Club（ゴースト部）">
    <meta property="og:title" content="他のページ｜Ghost Club（ゴースト部）" id="ogTitle">
    <meta property="og:description" content="ゴースト部（Ghost Club）のメンバーや企画ごとのページ一覧です。" id="ogDesc">
    <meta property="og:url" content="https://tendonch.github.io/people.html" id="ogUrl">
    <meta property="og:image" content="https://tendonch.github.io/bg-dark.jpg">
    <meta property="og:locale" content="ja_JP">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <meta name="color-scheme" content="light dark">
    <meta name="darkreader-lock">
    <link rel="stylesheet" href="style.css?v=9">
    <script>
        // 画面が描画される前にライト/ダークを決める（背景画像のちらつき・表示漏れ防止）
        (function () {
            try {
                if (localStorage.getItem('themeV') !== '2') { localStorage.removeItem('theme'); localStorage.setItem('themeV', '2'); }   // 初期値を「システム」に統一（1回だけ）
                var t = localStorage.getItem('theme');
                var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (dark) document.documentElement.setAttribute('data-theme', 'dark');
            } catch (e) {}
        })();
    </script>
</head>
<body>

    <div class="bg-image-layer" id="bgLayer"></div>

    <!-- お知らせバー（全ページ共通） -->
    <div id="announceArea"></div>

    <div class="container">
        <nav id="siteNav" class="site-nav"></nav>
        <h1>Ghost Club</h1>
        <p class="site-desc">他のページ</p>

        <div class="section">
            <div class="title-row">
                <div class="section-title">他のページ</div>
                <div id="pgAdd"></div>
            </div>
            <div id="pgArea"></div>
        </div>

    </div>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="site.js?v=10"></script>
    <script>
    state.pages = [];

    async function loadPageData() {
        if (!sb) return;
        const p = await sb.from('pages').select('*').is('parent_id', null).order('sort_order').order('created_at');
        if (p.error) { console.warn('ページを取得できません（SQLを実行済みか確認してください）', p.error.message); state.pages = []; return; }
        state.pages = p.data;
    }

    function renderPage() {
        $('#pgAdd').innerHTML = editMode ? '<button class="mini-btn add" data-act="add" data-kind="page">＋ ページを追加</button>' : '';
        const box = $('#pgArea');
        if (!state.pages.length) { box.innerHTML = '<div class="member-box">まだ他のページはありません。</div>'; return; }
        box.innerHTML = '<div class="member-grid">' + state.pages.map(p => {
            const icon = safeIcon(p.icon_url);
            const avatar = icon ? `<img class="member-avatar" src="${esc(icon)}" alt="">` : `<div class="member-avatar ph">${esc((p.title || '?').slice(0, 1))}</div>`;
            return `<div class="member-card"><a class="member-main" href="page.html?p=${encodeURIComponent(p.slug)}">${avatar}<div class="member-info">
                <div class="member-name">${esc(p.title)}</div>${p.description ? `<div class="member-intro">${esc(p.description)}</div>` : ''}
            </div></a>${adminBtns('page', p.id)}</div>`;
        }).join('') + '</div>';
    }

    startSite();

    </script>
</body>
</html>
